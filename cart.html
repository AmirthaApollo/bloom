<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<title>Your bag · Bloom</title>
<meta name="description" content="Review your Bloom shopping bag.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Jost:ital,wght@0,200..600;1,200..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260916z">
<link rel="stylesheet" href="css/responsive.css?v=20260916z">
</head>
<body data-page="cart">

<div id="app-header"></div>

<main>
  <div class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a><span class="sep" data-icon="flower" data-icon-class="i-xs"></span><a href="shop.html">Shop</a><span class="sep" data-icon="flower" data-icon-class="i-xs"></span><span class="crumb-current">Bag</span>
    </nav>
  </div>

  <section class="page-hero">
    <span class="deco-leaf-tl" data-icon="sprig"></span>
    <span class="deco-leaf-c" style="right:3%;bottom:6%" data-icon="leaf"></span>
    <div class="container">
      <p class="eyebrow">reserve your finds</p>
      <h1>Your bag</h1>
      <p>Your campus finds, waiting for checkout. Pickup is arranged with each seller.</p>
    </div>
  </section>

  <!-- empty state -->
  <div class="cart-empty" style="display:none">
    <div class="flower-big" data-icon="leaf" data-icon-class="i-xl"></div>
    <h3>Your bag is feeling light</h3>
    <p>Fill it with something lovely · there are new listings on campus every day.</p>
    <a class="btn btn-primary btn-lg" href="shop.html">Start browsing</a>
  </div>

  <div class="container" style="padding-top:26px">
    <div class="cart-layout">
      <div class="cart-list">
        <div class="cart-table">
          <div class="thead">
            <span></span><span>Product</span><span>Qty</span><span>Unit / Total</span><span></span>
          </div>
          <div class="tbody"></div>
        </div>
        <div style="margin-top:22px">
          <a class="btn btn-light" href="shop.html"><span data-icon="arrowL" data-icon-class="i-sm"></span> Continue shopping</a>
        </div>
      </div>
      <div class="cart-summary-wrap">
        <div class="cart-summary-card"></div>
      </div>
    </div>
  </div>

  <div class="divider-flourish"><span data-icon="sprig" data-icon-class="i-sm"></span><span data-icon="flower" data-icon-class="i-sm"></span><span data-icon="sprig" data-icon-class="i-sm"></span></div>
</main>

<div id="app-footer"></div>

<script src="js/products.js?v=20260916z"></script>
<script src="js/marketplace.js?v=20260916z"></script>
<script src="js/app.js?v=20260916z"></script>
<script src="js/cart.js?v=20260916z"></script>
<script src="js/wishlist.js?v=20260916z"></script>
<script>
  Cart.initCartPage();
  document.querySelectorAll('[data-view-link]').forEach(()=>{});
</script>
<script>App.boot()</script>
</body>
</html>
