<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<title>Wishlist · Bloom</title>
<meta name="description" content="Your saved Bloom favourites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Jost:ital,wght@0,200..600;1,200..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260916z">
<link rel="stylesheet" href="css/responsive.css?v=20260916z">
</head>
<body data-page="wishlist">

<div id="app-header"></div>

<main id="wishlist-page">
  <div class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a><span class="sep" data-icon="flower" data-icon-class="i-xs"></span><a href="shop.html">Shop</a><span class="sep" data-icon="flower" data-icon-class="i-xs"></span><span class="crumb-current">Wishlist</span>
    </nav>
  </div>

  <section class="page-hero">
    <span class="deco-leaf-tl" data-icon="sprig"></span>
    <span class="deco-leaf-c" style="right:3%;bottom:6%" data-icon="leaf"></span>
    <div class="container">
      <p class="eyebrow">saved for later</p>
      <h1>Your wishlist</h1>
      <p>Where good intentions come to hibernate.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="wishlist-toolbar">
        <span class="count wishlist-count">0 items saved</span>
        <button class="btn btn-outline wish-move-all">Move all to bag</button>
      </div>
      <div class="wish-grid"></div>

      <div class="no-results wishlist-empty" style="display:none">
        <div class="flower-big" data-icon="heartF" data-icon-class="i-xl"></div>
        <h3>A quiet corner</h3>
        <p>Tap the heart on any product and it’ll keep it safe here for you.</p>
        <a class="btn btn-primary" href="shop.html">Browse the shop</a>
      </div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="js/products.js?v=20260916z"></script>
<script src="js/marketplace.js?v=20260916z"></script>
<script src="js/app.js?v=20260916z"></script>
<script src="js/cart.js?v=20260916z"></script>
<script src="js/wishlist.js?v=20260916z"></script>
<script>App.boot()</script>
</body>
</html>
